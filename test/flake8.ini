# ament_flake8's default configuration, except that double quotes are the preferred string
# quote style in this package (flake8-quotes defaults to single quotes).
[flake8]
extend-ignore = B902,C816,D100,D101,D102,D103,D104,D105,D106,D107,D203,D212,D404,I202
import-order-style = google
inline-quotes = "
max-line-length = 99
show-source = true
statistics = true
