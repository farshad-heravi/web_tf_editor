name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ros-build-test:
    name: ros (${{ matrix.ros_distro }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ros_distro: humble
            os: ubuntu-22.04
          - ros_distro: jazzy
            os: ubuntu-24.04
          - ros_distro: rolling
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # colcon packages web/dist/* into share/ via setup.py's web_dist_files(), so it must
      # exist before colcon build runs -- mirrors the web-build stage in the Dockerfile.
      - name: Build web bundle
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: ${{ matrix.ros_distro }}

      - uses: ros-tooling/action-ros-ci@v0.4
        with:
          package-name: web_tf_editor
          target-ros2-distro: ${{ matrix.ros_distro }}

  web-build:
    name: web bundle (lint-speed check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - working-directory: web
        run: |
          npm ci
          npm run build
