name: CI

on:
  push:
    branches: [jazzy]
  pull_request:
    branches: [jazzy]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ros-build-test:
    name: ros (${{ matrix.ros_distro }})
    runs-on: ubuntu-latest
    # Official ROS images: same OS/package set as the buildfarm for each distro, and no apt setup
    # to go wrong. No npm on purpose: web/dist/ is committed, and the buildfarm builds offline.
    container: ros:${{ matrix.ros_distro }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ros_distro: humble
          - ros_distro: jazzy
          # turtlebot3_manipulation_description (default robot) isn't released for rolling.
          - ros_distro: rolling
            skip_keys: turtlebot3_manipulation_description
    defaults:
      run:
        shell: bash
        working-directory: ros_ws
    steps:
      - uses: actions/checkout@v4
        with:
          path: ros_ws/src/web_tf_editor

      - name: Install dependencies
        run: |
          apt-get update
          rosdep update --rosdistro ${{ matrix.ros_distro }}
          rosdep install --from-paths src --ignore-src -y --skip-keys "${{ matrix.skip_keys }}"

      - name: Build
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          colcon build --event-handlers console_cohesion+

      - name: Test
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          colcon test --event-handlers console_direct+
          colcon test-result --verbose

  web-build:
    name: web bundle is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - working-directory: web
        run: |
          npm ci
          npm run build

      # web/dist/ is committed (the buildfarm has no npm), so it must match what web/src builds.
      - name: Check committed web/dist matches web/src
        run: |
          git status --porcelain web/dist
          git diff --exit-code web/dist || {
            echo "::error::web/dist is stale: run 'cd web && npm ci && npm run build' and commit web/dist."
            exit 1
          }
          test -z "$(git status --porcelain web/dist)"
